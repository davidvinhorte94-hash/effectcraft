[package]
name = "effectcraft-android"
description = "EffectCraft for Android: the shared engine and egui UI in a NativeActivity (eframe's Android runner), packaged as an APK by cargo-apk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `#[unsafe(no_mangle)]` on `android_main` is the one unsafe item the Android entry point needs
# (egui's own `hello_android` example opts out of its workspace lints for the same reason), so this
# crate sets its own lint levels instead of inheriting the workspace's `unsafe_code = "forbid"`.
# `unsafe_code` stays denied here; `android_main` carries the single, commented `allow`. The rest
# mirrors `[workspace.lints.clippy]`, and `src/lib.rs` carries the crate-level panic-free denies.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

[lib]
# cdylib: the Android runtime loads it. rlib: host builds (`cargo build`, `cargo test`) link it.
crate-type = ["cdylib", "rlib"]

# Everything Android-specific is `cfg(target_os = "android")`; on other targets this crate holds
# just the portable storage layout (`storage`), unit-tested natively.
[dependencies]
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-ui-egui = { workspace = true }
egui = { workspace = true }
# NativeActivity: builds with cargo-apk alone (no Gradle). Its soft keyboard support is limited;
# see README "Known limitations" for the GameActivity route.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
# The same winit eframe runs on (the `android-native-activity` feature above switches on its
# Android backend); only `AndroidApp` is named here.
winit = { version = "0.30", default-features = false }
serde_json = { workspace = true }
android_logger = "0.15"

# Read by cargo-apk. The APK is built by `.github/workflows/android.yml`, or locally as the README
# describes. `res/` (launcher icons) is generated by `prepare-res.sh` from the repository's own app
# icon and is not committed.
[package.metadata.android]
package = "com.example.effectcraftmobile"
apk_name = "EffectCraft-Mobile"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "EffectCraft Mobile"
icon = "@mipmap/ic_launcher"
